name: etichetta
version: 0.1.6
summary: A YOLO annotator, for human beings
description: |
  Etichetta is a YOLO annotator, for human beings. It allows you to
  annotate images with bounding boxes, and save the annotations in the YOLO
  format. A YOLO model in ONNX format can propose the boxes, on the GPU
  through WebGPU.
confinement: strict
grade: stable
base: core24
icon: snap/gui/etichetta.png

# onnxruntime is downloaded for x86_64 only
platforms:
  amd64:

# snap/gui/etichetta.desktop is used as the desktop entry of the app
apps:
  etichetta:
    command: bin/etichetta
    extensions: [gnome]
    plugs:
      - home
      - opengl

parts:
  etichetta:
    plugin: nil
    source: .
    build-packages:
      - curl
      - xz-utils
      - patchelf
      - build-essential
    override-build: |
      # The same LDC as the Linux CI, so the snap is built like the AppImage
      LDC_VERSION=1.43.0
      curl -fsSL https://github.com/ldc-developers/ldc/releases/download/v$LDC_VERSION/ldc2-$LDC_VERSION-linux-x86_64.tar.xz | tar -xJ -C /tmp
      export PATH=/tmp/ldc2-$LDC_VERSION-linux-x86_64/bin:$PATH

      # The setup downloads onnxruntime and the WebGPU plugin into ext/onnx/lib
      dub run :setup
      dub build --compiler=ldc2 --build=release

      # bin/ and lib/, as in the AppImage and the Flatpak: the WebGPU plugin is searched in ../lib
      install -Dm755 output/bin/etichetta $CRAFT_PART_INSTALL/bin/etichetta
      patchelf --set-rpath '$ORIGIN/../lib' $CRAFT_PART_INSTALL/bin/etichetta
      mkdir -p $CRAFT_PART_INSTALL/lib
      cp -P ext/onnx/lib/libonnxruntime*.so* $CRAFT_PART_INSTALL/lib/
