# separate terms of service, privacy policy, and support
# documentation.
name: Linux build + AppImage + Snap

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    strategy:
      matrix:
        os: [ ubuntu-22.04 ]
        dc: [ ldc-latest ]
        arch: [ x86_64 ]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Install D compiler
      uses: dlang-community/setup-dlang@v1
      with:
        compiler: ${{ matrix.dc }}

    - name: Build
      env:
        APPIMAGE_EXTRACT_AND_RUN: 1
      # The script runs the setup and the build itself
      run: ./appimage/appimage-build.sh

    - name: Archive production artifacts
      uses: actions/upload-artifact@v4
      with:
        name: appimage
        path: ./appimage/etichetta-x86_64.AppImage

  snap:

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - name: Build
      id: build
      uses: snapcore/action-build@v1

    - name: Archive production artifacts
      uses: actions/upload-artifact@v4
      with:
        name: snap
        path: ${{ steps.build.outputs.snap }}

